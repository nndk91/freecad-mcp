# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'freecad-mcp', args: config.onlyTextFeedback ? ['--only-text-feedback'] : [] })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required: []
    properties:
      onlyTextFeedback:
        type: boolean
        default: false
        description: Only return text feedback (without images)
  exampleConfig: {}
